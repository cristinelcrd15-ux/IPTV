<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canale TV</title>
<style>
:root{--bg:#0f1a2b;--panel:#182b47;--text:#eef2f8;--muted:#93a6bf;--sig:#ffb703}
*{box-sizing:border-box}
html{font-size:2.4vh}
@media (max-aspect-ratio:1/1){html{font-size:2vh}}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
video{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain}
#ui{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--bg);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;padding:.8rem 1.5rem;background:var(--panel)}
#logo{height:2.6rem;margin-right:1.5rem}
button{font:inherit;color:var(--text);background:transparent;border:.12rem solid var(--muted);border-radius:.4rem;padding:.3rem .9rem;margin-right:1rem;cursor:pointer}
h1{flex:1;margin:0;font-size:1.1rem;font-weight:500;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#q{font:inherit;width:14rem;max-width:100%;color:var(--text);background:var(--bg);border:.12rem solid var(--muted);border-radius:.4rem;padding:.35rem .8rem}
#q:focus{outline:none;border-color:var(--sig)}
#grid{flex:1;overflow-y:auto;position:relative;display:flex;flex-wrap:wrap;align-content:flex-start;padding:1rem 1rem 2rem 1.5rem}
.t{width:11rem;height:8.5rem;margin:.5rem;padding:.75rem;border-radius:.6rem;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s;background:linear-gradient(160deg,hsl(var(--h),42%,32%),hsl(var(--h),48%,20%))}
.t.on{outline:.22rem solid var(--sig);outline-offset:.1rem;transform:scale(1.05);position:relative;z-index:1}
.t b{font-size:1.8rem;letter-spacing:.02em}
.n{margin-top:auto;font-weight:600;line-height:1.15;max-height:2.3em;overflow:hidden}
.s{font-size:.7rem;color:#d3dcea;margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{padding:.5rem 1.5rem;font-size:.7rem;color:var(--muted);background:var(--panel)}
#msg{display:none;position:fixed;left:50%;bottom:6%;transform:translateX(-50%);background:rgba(15,26,43,.92);padding:.6rem 1.2rem;border-radius:.5rem;max-width:80%;text-align:center}
#pback{display:none;position:fixed;top:1rem;left:1rem;background:rgba(15,26,43,.85)}
#info{display:none;position:fixed;left:0;right:0;bottom:0;padding:1.2rem 2rem 1.5rem;background:linear-gradient(transparent,rgba(15,26,43,.96) 35%)}
#info .top{display:flex;align-items:baseline}
#info .no{font-size:2.6rem;font-weight:700;color:var(--sig);margin-right:1.2rem}
#info .nm{font-size:1.6rem;font-weight:600}
#info .row{margin-top:.5rem;display:flex;font-size:.95rem;color:var(--muted)}
#info .row.now{color:#fff;font-weight:600}
#info .tm{width:9rem}
#guide{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,26,43,.97);flex-direction:column}
#guide h2{margin:0;padding:1rem 1.5rem;background:var(--panel);font-size:1.2rem}
#grows{flex:1;overflow-y:auto;position:relative}
.gr{display:flex;align-items:center;padding:.6rem 1.5rem;border-left:.3rem solid transparent}
.gr.on{background:var(--panel);border-left-color:var(--sig)}
.gr .no{width:3.5rem;color:var(--sig);font-weight:700}
.gr .nm{width:17rem;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gr .p{flex:1;padding-left:1rem;font-size:.85rem;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gr .p b{color:var(--text);font-weight:600}
#cc{display:none;position:fixed;left:1rem;bottom:1rem;background:rgba(15,26,43,.85)}
#sub{display:none;position:fixed;left:50%;bottom:14%;transform:translateX(-50%);max-width:70%;padding:.3rem .8rem;border-radius:.3rem;background:rgba(0,0,0,.7);font-size:1.1rem;text-align:center}
</style>
</head>

<script>
// ---------- Setări (poți lăsa cum sunt) ----------
var PLAYLISTS_FILE = "playlists.txt"; // fișierul în care pui linkurile tale
var CUSTOM_FILE = "custom.m3u";       // canalele tale personale (apar primele în țara lor)
var PROXY = "";                        // opțional, ex: "https://numele-tau.workers.dev/?url="
var REFRESH_MIN = 30;                  // la câte minute se reîncarcă listele
var MAX_PER_GROUP = 3000;

// ---------- Cod ----------
function $(id){ return document.getElementById(id); }
var video = $("v"), ui = $("ui"), grid = $("grid"), statusEl = $("status"), msgEl = $("msg");
var titleEl = $("title"), qEl = $("q"), backEl = $("back"), pbackEl = $("pback");
var groupsMap = {}, groupNames = [], flat = [], items = [], playList = [], onEl = null;
var curGroup = "", view = "home", isSearch = false, cur = -1, selI = 0, firstLoad = true;
var hls = null, token = 0, msgTimer = null, qTimer = null, pbTimer = null;

function store(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function two(n){ return (n < 10 ? "0" : "") + n; }
function setStatus(t){ statusEl.textContent = t; }
function trim(s){ return s.replace(/^\s+|\s+$/g, ""); }

function showMsg(t, ms){
  clearTimeout(msgTimer);
  msgEl.textContent = t; msgEl.style.display = "block";
  if (ms) msgTimer = setTimeout(hideMsg, ms);
}
function hideMsg(){ msgEl.style.display = "none"; }
function showPBack(){
  pbackEl.style.display = "block";
  clearTimeout(pbTimer);
  pbTimer = setTimeout(function(){ pbackEl.style.display = "none"; }, 4000);
}

function get(url, cb){
  var x = new XMLHttpRequest();
  x.open("GET", url, true);
  x.timeout = 60000;
  x.onload = function(){ if (x.status >= 200 && x.status < 300) cb(null, x.responseText); else cb(new Error("HTTP " + x.status)); };
  x.onerror = x.ontimeout = function(){ cb(new Error("rețea")); };
  x.send();
}
function getSmart(url, cb){
  get(url, function(err, t){
    if (!err || !PROXY) return cb(err, t);
    get(PROXY + encodeURIComponent(url), cb);
  });
}

function parse(text, src){
  var out = [], lines = text.split(/\r?\n/), info = null, i, l, m, m2;
  if (/#EXT-X-(STREAM-INF|TARGETDURATION)/.test(text)) {
    return [{ name: src.replace(/^https?:\/\//, "").split("/").slice(0, 2).join("/"), group: "Link direct", url: src }];
  }
  for (i = 0; i < lines.length; i++) {
    l = trim(lines[i]);
    if (!l) continue;
    if (l.indexOf("#EXTINF") === 0) {
      m = l.match(/group-title="([^"]*)"/);
      m2 = l.match(/tvg-id="([^"]*)"/);
      info = { name: trim(l.substring(l.lastIndexOf(",") + 1)) || "Canal", group: m ? m[1] : "", id: m2 ? m2[1] : "" };
    } else if (l.charAt(0) !== "#" && /^https?:\/\//i.test(l)) {
      out.push({ name: info ? info.name : l, group: info ? info.group : "", url: l, id: info ? info.id : "" });
      info = null;
    }
  }
  return out;
}

// ---------- Ecranele: țări, canale, rezultate ----------
function hue(s){ var h = 0, i; for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function mono(s){
  var p = trim(s.replace(/[^A-Za-zÀ-ž0-9 ]/g, "")).split(/\s+/), a = p[0] || "";
  return (a.charAt(0) + (p[1] ? p[1].charAt(0) : a.charAt(1))).toUpperCase();
}
function tile(i, name, sub){
  return '<div class="t" data-i="' + i + '" style="--h:' + hue(name) + '"><b>' + esc(mono(name)) + '</b><span class="n">' + esc(name) + '</span>' + (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</div>';
}

function renderTiles(){
  var h = [], i, c;
  for (i = 0; i < items.length; i++) {
    c = items[i];
    h.push(tile(i, c.name, view === "home" ? c.sub : (isSearch ? c.group : "")));
  }
  grid.innerHTML = h.join("");
  grid.scrollTop = 0;
  onEl = null;
}

function select(i){
  if (!items.length) return;
  selI = Math.max(0, Math.min(items.length - 1, i));
  var el = grid.children[selI];
  if (!el) return;
  if (onEl) onEl.className = "t";
  el.className = "t on";
  onEl = el;
  var top = el.offsetTop - 12, bottom = el.offsetTop + el.offsetHeight + 24;
  if (top < grid.scrollTop) grid.scrollTop = top;
  else if (bottom > grid.scrollTop + grid.clientHeight) grid.scrollTop = bottom - grid.clientHeight;
}

function cols(){
  var t = grid.children, n = 0;
  if (!t.length) return 1;
  while (n < t.length && t[n].offsetTop === t[0].offsetTop) n++;
  return n || 1;
}

function showHome(){
  var i, k = 0;
  view = "home"; isSearch = false; items = [];
  titleEl.textContent = "Alege țara"; backEl.style.display = "none";
  for (i = 0; i < groupNames.length; i++) {
    items.push({ name: groupNames[i], sub: groupsMap[groupNames[i]].length + " canale" });
    if (groupNames[i] === curGroup) k = i;
  }
  renderTiles();
  select(k);
}

function openGroup(name, selUrl){
  var i, k = 0;
  curGroup = name; view = "list"; isSearch = false; items = groupsMap[name];
  titleEl.textContent = name + " · " + items.length + " canale"; backEl.style.display = "inline-block";
  store("iptv_group", name);
  renderTiles();
  if (selUrl) { for (i = 0; i < items.length; i++) { if (items[i].url === selUrl) { k = i; break; } } }
  select(k);
}

function openResults(text, selUrl){
  var i, k = 0, q = text.toLowerCase();
  items = [];
  for (i = 0; i < flat.length && items.length < 300; i++) {
    if (flat[i].name.toLowerCase().indexOf(q) !== -1) items.push(flat[i]);
  }
  view = "list"; isSearch = true;
  titleEl.textContent = "Rezultate pentru „" + text + "” · " + items.length; backEl.style.display = "inline-block";
  renderTiles();
  if (selUrl) { for (i = 0; i < items.length; i++) { if (items[i].url === selUrl) { k = i; break; } } }
  select(k);
}

function goBack(){
  qEl.value = "";
  showHome();
}

function activate(i){
  if (view === "home") { if (groupNames[i]) openGroup(groupNames[i]); }
  else if (items[i]) { playList = items; play(i); }
}

function setChannels(list){
  var playUrl = cur >= 0 && playList[cur] ? playList[cur].url : null;
  var selKey = items[selI] ? items[selI].url : null;
  var first = firstLoad, i, j, c, g, arr, found = false, lg;
  firstLoad = false;
  flat = list; groupsMap = {}; groupNames = [];
  for (i = 0; i < list.length; i++) {
    c = list[i]; g = c.group || "Altele";
    if (!groupsMap[g]) { groupsMap[g] = []; groupNames.push(g); }
    if (groupsMap[g].length < MAX_PER_GROUP) groupsMap[g].push(c);
  }
  groupNames.sort(function(a, b){ return a.localeCompare(b); });
  if (playUrl) {
    for (i = 0; i < groupNames.length && !found; i++) {
      arr = groupsMap[groupNames[i]];
      for (j = 0; j < arr.length; j++) { if (arr[j].url === playUrl) { playList = arr; cur = j; found = true; break; } }
    }
  }
  if (view === "play") return;
  playList = []; cur = -1;
  if (view === "list" && isSearch) { openResults(qEl.value, selKey); return; }
  lg = view === "list" ? curGroup : (first ? load("iptv_group") : null);
  if (lg && groupsMap[lg]) openGroup(lg, view === "list" ? selKey : (first ? load("iptv_last") : null));
  else showHome();
}

// ---------- Player ----------
function destroyHls(){ if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } }

function stop(){
  token++;
  destroyHls();
  video.onerror = null; video.onplaying = null;
  video.pause();
  video.removeAttribute("src");
  try { video.load(); } catch (e) {}
  hideMsg();
}

function leavePlayer(){
  if (view !== "play") return;
  var url = playList[cur] ? playList[cur].url : null;
  stop();
  cur = -1;
  pbackEl.style.display = "none";
  ccEl.style.display = "none"; subText(""); infoOpen = false; $("info").style.display = "none"; closeGuide();
  ui.style.display = "flex";
  view = "list";
  if (isSearch) openResults(qEl.value, url);
  else openGroup(curGroup, url);
}

function play(i){
  if (!playList.length) return;
  cur = (i + playList.length) % playList.length;
  view = "play";
  ui.style.display = "none";
  showPBack();
  ccEl.style.display = "block"; updateCC();
  var c = playList[cur], u = c.url, my = ++token;
  store("iptv_last", u); renderInfo();
  showMsg(c.name + " — se încarcă…", 0);
  destroyHls();
  video.onerror = null;
  video.onplaying = function(){ if (my === token) { showMsg(c.name, 2500); applySubs(); } };
  function fail(){ if (my === token) showMsg("Canalul „" + c.name + "” nu pornește. Apasă ↑ sau ↓ pentru alt canal.", 0); }
  function native(){
    destroyHls();
    video.onerror = fail;
    video.src = u;
    var p = video.play();
    if (p && p.catch) p.catch(function(){});
  }
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.on(Hls.Events.ERROR, function(e, d){ if (d.fatal && my === token) native(); });
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ var p = video.play(); if (p && p.catch) p.catch(function(){}); });
    hls.loadSource(u);
    hls.attachMedia(video);
  } else {
    native();
  }
}

// ---------- Încărcarea listelor ----------
function fromCache(extra){
  var raw = load("iptv_channels"), a, l = [], i;
  if (raw) {
    try {
      a = JSON.parse(raw);
      for (i = 0; i < a.length; i++) l.push({ name: a[i][0], group: a[i][1], url: a[i][2], id: a[i][3] || "" });
      setChannels(l);
      setStatus(extra + " Folosesc ultima listă salvată (" + l.length + " canale).");
      return;
    } catch (e) {}
  }
  setStatus(extra + " Nu există nicio listă salvată.");
}

var custom = [];
function loadAll(){
  setStatus("Se actualizează lista…");
  get(CUSTOM_FILE + "?t=" + new Date().getTime(), function(ce, ct){ custom = ce ? [] : parse(ct, CUSTOM_FILE); });
  getSmart(PLAYLISTS_FILE + "?t=" + new Date().getTime(), function(err, txt){
    if (err) return fromCache("Nu pot citi " + PLAYLISTS_FILE + ".");
    var urls = [], lines = txt.split(/\r?\n/), i, l;
    for (i = 0; i < lines.length; i++) {
      l = trim(lines[i]);
      if (/^https?:\/\//i.test(l)) urls.push(l);
    }
    if (!urls.length) return fromCache("Fișierul " + PLAYLISTS_FILE + " nu are linkuri.");
    var left = urls.length, all = [], ok = 0;
    urls.forEach(function(u){
      getSmart(u, function(e, t){
        if (!e) { var p = parse(t, u); if (p.length) { all = all.concat(p); ok++; } }
        if (--left === 0) finish(all, ok, urls.length);
      });
    });
  });
}

function finish(all, ok, total){
  all = custom.concat(all);
  if (!all.length) return fromCache("Niciun link nu a răspuns.");
  var seen = {}, uniq = [], packed = [], i;
  for (i = 0; i < all.length; i++) {
    if (!seen[all[i].url]) { seen[all[i].url] = 1; uniq.push(all[i]); packed.push([all[i].name, all[i].group, all[i].url, all[i].id || ""]); }
  }
  setChannels(uniq);
  store("iptv_channels", JSON.stringify(packed));
  var d = new Date();
  setStatus(ok + " din " + total + " liste încărcate · " + uniq.length + " canale · actualizat " + two(d.getHours()) + ":" + two(d.getMinutes()));
}

// ---------- Ghid de programe (XMLTV) ----------
var EPG_FILE = "epg.txt";          // fișier cu linkuri către ghiduri XMLTV, câte unul pe linie
var GUIDE_KEYS = [458, 172, 71];   // butonul GUIDE de pe telecomandă (și tasta G de la tastatură)
var DEBUG_KEYS = location.search.indexOf("keys") !== -1;   // adaugă ?keys la adresă ca să vezi codul fiecărei taste
var epg = {}, infoOpen = false, guideOpen = false, gList = [], gI = 0, gOn = null;

function xmlDec(s){ return s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&"); }
function xtime(s){
  var m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?\s*([+-]\d{4})?/.exec(s || ""), t;
  if (!m) return 0;
  t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
  if (m[7]) t -= (m[7].charAt(0) === "-" ? -1 : 1) * (+m[7].substr(1, 2) * 60 + +m[7].substr(3, 2)) * 60000;
  return t;
}
function parseXmltv(text){
  var re = /<programme\s([^>]*)>([\s\S]*?)<\/programme>/g, m, ch, s, e, t, now = new Date().getTime(), lo = now - 3600000, hi = now + 129600000;
  while ((m = re.exec(text))) {
    ch = /channel="([^"]*)"/.exec(m[1]); s = /start="([^"]*)"/.exec(m[1]); e = /stop="([^"]*)"/.exec(m[1]); t = /<title[^>]*>([\s\S]*?)<\/title>/.exec(m[2]);
    if (!ch || !s || !e || !t) continue;
    s = xtime(s[1]); e = xtime(e[1]);
    if (e < lo || s > hi) continue;
    (epg[ch[1]] = epg[ch[1]] || []).push({ s: s, e: e, t: xmlDec(trim(t[1])) });
  }
}
function loadEpg(){
  get(EPG_FILE + "?t=" + new Date().getTime(), function(err, txt){
    if (err) return;
    var urls = [], lines = txt.split(/\r?\n/), i, left;
    for (i = 0; i < lines.length; i++) { if (/^https?:\/\//i.test(trim(lines[i]))) urls.push(trim(lines[i])); }
    left = urls.length;
    if (!left) return;
    epg = {};
    urls.forEach(function(u){
      getSmart(u, function(e, t){
        if (!e) parseXmltv(t);
        if (--left === 0) {
          var k;
          for (k in epg) { epg[k].sort(function(a, b){ return a.s - b.s; }); }
          renderInfo();
        }
      });
    });
  });
}
function hm(t){ var d = new Date(t); return two(d.getHours()) + ":" + two(d.getMinutes()); }
function sched(c, n){   // programul curent și cele următoare pentru un canal
  var a = c && c.id ? epg[c.id] : null, now = new Date().getTime(), out = [], i;
  if (!a) return out;
  for (i = 0; i < a.length && out.length < n; i++) { if (a[i].e > now) out.push(a[i]); }
  return out;
}

// ---------- Informații canal (OK) ----------
function toggleInfo(){ infoOpen = !infoOpen; renderInfo(); }
function renderInfo(){
  var el = $("info"), c = playList[cur], p, h, i, now = new Date().getTime();
  if (!infoOpen || view !== "play" || !c) { el.style.display = "none"; return; }
  p = sched(c, 4);
  h = '<div class="top"><span class="no">' + (cur + 1) + '</span><span class="nm">' + esc(c.name) + '</span></div>';
  if (!p.length) h += '<div class="row"><span class="tm"></span><span>Grila de programe nu este disponibilă pentru acest canal.</span></div>';
  for (i = 0; i < p.length; i++) {
    h += '<div class="row' + (p[i].s <= now ? ' now' : '') + '"><span class="tm">' + hm(p[i].s) + ' – ' + hm(p[i].e) + '</span><span>' + esc(p[i].t) + '</span></div>';
  }
  el.innerHTML = h;
  el.style.display = "block";
}

// ---------- Ghid TV (butonul GUIDE) ----------
function toggleGuide(){
  var h = [], i, p, c;
  if (guideOpen) { closeGuide(); return; }
  gList = view === "play" ? playList : (view === "list" ? items : []);
  if (!gList.length) { showMsg("Alege mai întâi o țară, ca să pot arăta ghidul canalelor ei.", 2500); return; }
  for (i = 0; i < gList.length; i++) {
    c = gList[i]; p = sched(c, 2);
    h.push('<div class="gr" data-i="' + i + '"><span class="no">' + (i + 1) + '</span><span class="nm">' + esc(c.name) + '</span><span class="p">' +
      (p.length ? '<b>' + hm(p[0].s) + ' ' + esc(p[0].t) + '</b>' + (p[1] ? ' · ' + hm(p[1].s) + ' ' + esc(p[1].t) : '') : 'Fără informații despre program') + '</span></div>');
  }
  $("grows").innerHTML = h.join("");
  $("gtitle").textContent = "Ghid TV" + (!isSearch && curGroup ? " · " + curGroup : "");
  guideOpen = true; gOn = null;
  $("guide").style.display = "flex";
  gSel(view === "play" ? cur : selI);
}
function gSel(i){
  var rows = $("grows"), el, top, b;
  gI = Math.max(0, Math.min(gList.length - 1, i));
  el = rows.children[gI];
  if (!el) return;
  if (gOn) gOn.className = "gr";
  el.className = "gr on"; gOn = el;
  top = el.offsetTop; b = top + el.offsetHeight;
  if (top < rows.scrollTop) rows.scrollTop = top;
  else if (b > rows.scrollTop + rows.clientHeight) rows.scrollTop = b - rows.clientHeight;
}
function closeGuide(){ guideOpen = false; $("guide").style.display = "none"; }
function guideKey(k){
  var l, i;
  if (k === 38) gSel(gI - 1);
  else if (k === 40) gSel(gI + 1);
  else if (k === 33) gSel(gI - 8);
  else if (k === 34) gSel(gI + 8);
  else if (k === 13) { l = gList; i = gI; closeGuide(); playList = l; play(i); }
  else if (k === 37 || k === 8 || k === 27 || k === 461 || k === 10009 || GUIDE_KEYS.indexOf(k) !== -1) closeGuide();
}

// ---------- Subtitrare în română ----------
var TRANSLATE_URL = "";   // opțional: serviciu propriu de traducere, ex. "https://numele-tau.workers.dev/t"
var LANG = {"United States":"en","United Kingdom":"en","Ireland":"en","Australia":"en","Canada":"en","France":"fr","Germany":"de","Austria":"de","Switzerland":"de","Italy":"it","Spain":"es","Mexico":"es","Argentina":"es","Portugal":"pt","Brazil":"pt","Russia":"ru","Ukraine":"uk","Poland":"pl","Hungary":"hu","Bulgaria":"bg","Serbia":"sr","Croatia":"hr","Greece":"el","Turkey":"tr","Netherlands":"nl","Belgium":"nl","Sweden":"sv","Norway":"no","Denmark":"da","Finland":"fi","Czech Republic":"cs","Slovakia":"sk","Albania":"sq","China":"zh","Japan":"ja","South Korea":"ko","India":"hi","Israel":"he"};
var ccEl = $("cc"), subsOn = load("iptv_subs") === "1", subLines = {}, subTr = null;

function updateCC(){ ccEl.textContent = "Subtitrare RO: " + (subsOn ? "pornit" : "oprit"); }
function subText(t){ var el = $("sub"); el.style.display = t ? "block" : "none"; el.textContent = t || ""; }
function toggleSubs(){
  subsOn = !subsOn;
  store("iptv_subs", subsOn ? "1" : "0");
  updateCC();
  applySubs(true);
  if (!subsOn) showMsg("Subtitrarea este oprită.", 2000);
}
function hlsSel(tr){
  var s = hls && hls.subtitleTracks, j;
  if (!s || !s.length) return;
  for (j = 0; j < s.length; j++) { if ((s[j].lang || s[j].name) === (tr.language || tr.label)) { hls.subtitleTrack = j; return; } }
}
function applySubs(announce){
  var c = playList[cur], g = c ? (c.group || curGroup) : "", L = LANG[g] || "", list = video.textTracks, n = list ? list.length : 0, i, l, ro = null, pick = null;
  subText("");
  for (i = 0; i < n; i++) {
    list[i].oncuechange = null;
    l = (list[i].language || "").toLowerCase().substr(0, 2);
    if (l === "ro") ro = ro || list[i];
    else if (!pick || (L && l === L)) pick = list[i];
  }
  if (!subsOn) { if (hls) hls.subtitleTrack = -1; for (i = 0; i < n; i++) list[i].mode = "disabled"; return; }
  if (g === "Romania" || g === "Moldova") { if (announce) showMsg("Canalul este deja în limba română.", 2500); return; }
  if (!ro && !pick) { if (announce) showMsg("Acest stream nu are subtitrare încorporată. Traducerea automată din voce are nevoie de un serviciu separat.", 6000); return; }
  for (i = 0; i < n; i++) list[i].mode = "disabled";
  if (ro) {
    if (hls) { hls.subtitleDisplay = true; hlsSel(ro); }
    ro.mode = "showing";
    if (announce) showMsg("Subtitrare în română activată.", 2500);
    return;
  }
  if (hls) { hls.subtitleDisplay = false; hlsSel(pick); }
  pick.mode = "hidden";
  pick.oncuechange = function(){ showCue(pick, (pick.language || L || "").toLowerCase().substr(0, 2)); };
  if (announce) showMsg("Subtitrare tradusă în română (din " + (pick.language || L || "limba originală") + ").", 3000);
}
function showCue(tr, from){
  var a = tr.activeCues, t = "", i;
  if (!a || !a.length) { subText(""); return; }
  for (i = 0; i < a.length; i++) t += (i ? " " : "") + (a[i].text || "").replace(/<[^>]*>/g, "");
  t = trim(t);
  translate(t, from, function(r){ subText(r || t); });
}
function translate(text, from, cb){
  if (!text) return cb("");
  if (subLines[text]) return cb(subLines[text]);
  function done(r){ if (r) subLines[text] = r; cb(r); }
  if (window.Translator && from) {
    (subTr && subTr.from === from ? Promise.resolve(subTr.t) : Translator.create({ sourceLanguage: from, targetLanguage: "ro" }).then(function(t){ subTr = { from: from, t: t }; return t; }))
      .then(function(t){ return t.translate(text); })
      .then(done, function(){ cb(null); });
  } else if (TRANSLATE_URL) {
    get(TRANSLATE_URL + "?from=" + from + "&to=ro&q=" + encodeURIComponent(text), function(e, r){
      var o = null;
      if (!e) { try { o = JSON.parse(r).text; } catch (x) {} }
      done(o);
    });
  } else cb(null);
}

// ---------- Telecomandă, mouse, atingere ----------
document.addEventListener("keydown", function(e){
  var k = e.keyCode, back = (k === 8 || k === 27 || k === 461 || k === 10009), n;
  if (document.activeElement === qEl) {
    if (k === 40 || k === 13) { qEl.blur(); e.preventDefault(); }
    else if (k === 27 || k === 461 || k === 10009) qEl.blur();
    return;
  }
  if (DEBUG_KEYS) showMsg("Cod tastă: " + k, 1500);
  if (guideOpen) { guideKey(k); e.preventDefault(); return; }
  if (GUIDE_KEYS.indexOf(k) !== -1) { toggleGuide(); e.preventDefault(); return; }
  if (view === "play") {
    if (k === 38) play(cur - 1);
    else if (k === 40) play(cur + 1);
    else if (k === 13) toggleInfo();
    else if (k === 37 || back) leavePlayer();
    else if (k === 39 || k === 460 || k === 83) toggleSubs();
    else return;
    e.preventDefault();
    return;
  }
  n = cols();
  if (k === 37) select(selI - 1);
  else if (k === 39) select(selI + 1);
  else if (k === 38) { if (selI - n < 0) qEl.focus(); else select(selI - n); }
  else if (k === 40) select(selI + n);
  else if (k === 13) activate(selI);
  else if (back && view === "list") goBack();
  else return;
  e.preventDefault();
});

grid.onclick = function(e){
  var t = e.target;
  while (t && t !== grid && !(t.className && /(^| )t( |$)/.test(t.className))) t = t.parentNode;
  if (!t || t === grid) return;
  var i = parseInt(t.getAttribute("data-i"), 10);
  select(i);
  activate(i);
};
backEl.onclick = goBack;
pbackEl.onclick = leavePlayer;
video.onclick = function(){ showPBack(); toggleInfo(); };
qEl.oninput = function(){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){
    var v = trim(qEl.value);
    if (v.length >= 2) openResults(v);
    else if (isSearch) showHome();
  }, 300);
};

loadAll();
setInterval(loadAll, REFRESH_MIN * 60000);
loadEpg();
setInterval(loadEpg, REFRESH_MIN * 60000);
ccEl.onclick = toggleSubs;
video.textTracks.onaddtrack = function(){ applySubs(); };
$("grows").onclick = function(e){
  var t = e.target;
  while (t && !(t.className && /(^| )gr( |$)/.test(t.className))) t = t.parentNode;
  if (t) { gSel(parseInt(t.getAttribute("data-i"), 10)); guideKey(13); }
};
</script>
